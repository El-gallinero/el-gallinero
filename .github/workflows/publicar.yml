name: Publicar El Gallinero y la encuesta en GitHub Pages

# Un único despliegue con los dos proyectos:
#   /el-gallinero/               -> juego del zorro (Phaser + Vite, se compila desde src/)
#   /el-gallinero/convicciones/  -> encuesta «¿No sabes a quién votar?» (un solo HTML)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compilar el juego del zorro
        run: |
          npm ci
          npm run build
      - name: Añadir la encuesta
        run: |
          mkdir -p dist/convicciones
          cp convicciones/index.html dist/convicciones/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
