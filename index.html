<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14101c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>El Gallinero</title>
<meta name="description" content="Una gallina, cinco urnas. El futuro del país está en tus patas." />
<meta property="og:type" content="website" />
<meta property="og:title" content="El Gallinero ¡A votar!" />
<meta property="og:description" content="Una gallina, cinco urnas. El futuro del país está en tus patas." />
<meta property="og:image" content="https://el-gallinero.github.io/el-gallinero/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://el-gallinero.github.io/el-gallinero/" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='5' y='1' width='6' height='2' fill='%23d8242c'/%3E%3Crect x='4' y='3' width='8' height='9' fill='%23fff'/%3E%3Crect x='7' y='6' width='3' height='2' fill='%23f0a020'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23000'/%3E%3C/svg%3E" />
<style>
  :root { --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
          --safe-t: env(safe-area-inset-top, 0px);  --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14101c;
               overscroll-behavior: none; touch-action: none; position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; }
  #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

  /* Joystick virtual: zona táctil amplia abajo a la izquierda */
  #joy-zone { position: fixed; left: 0; bottom: 0; width: 62vw; height: 46vh; z-index: 5; touch-action: none; display: none; }
  #joy-zone.on { display: block; }
  #joy-base { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
              background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.35);
              box-shadow: inset 0 0 0 3px rgba(20,16,28,.25); pointer-events: none; opacity: .75; transition: opacity .15s; }
  #joy-base.active { opacity: 1; background: rgba(255,255,255,.2); }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
              background: rgba(255,255,255,.55); border: 3px solid rgba(255,255,255,.85); box-shadow: 0 3px 0 rgba(20,16,28,.35); }

  /* Botón de sonido (estética pixel) */
  #mute { position: fixed; top: calc(10px + var(--safe-t)); right: calc(10px + var(--safe-r)); z-index: 6; width: 44px; height: 44px;
          padding: 0; border: 0; background: rgba(20,16,28,.55); border-radius: 6px; cursor: pointer;
          box-shadow: inset 0 0 0 3px #f4e3b1, 0 3px 0 rgba(0,0,0,.4); display: none; touch-action: manipulation; }
  #mute.on { display: block; }
  #mute svg { width: 28px; height: 28px; shape-rendering: crispEdges; display: block; margin: 0 auto; }

  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f4e3b1;
          font: 12px 'Press Start 2P', monospace; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">CARGANDO…</div>
<div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
<button id="mute" aria-label="Sonido" title="Sonido"></button>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
