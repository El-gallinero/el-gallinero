<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#c9d4f2"><meta name="description" content="Quince dilemas. Tres respuestas. Tus ideas, sin etiquetas."><title>En qué crees — 15 dilemas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--lav:#c9d4f2;--ink:#17191e;--muted:#616b7e;--cream:#f7f8fc;--yellow:#f4e196;--line:#dfe3ed;--white:#fff}*{box-sizing:border-box}html{background:var(--lav)}body{margin:0;color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #52639e;outline-offset:3px}.shell{min-height:100svh;background:var(--lav);padding:18px 14px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{width:min(100%,630px);margin:0 auto 22px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 18px 'Manrope',sans-serif;letter-spacing:-.9px}.brand span{display:inline-block;width:10px;height:10px;background:var(--ink);border-radius:50%;margin-right:7px}.mini{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:1px solid #a7b3d0;border-radius:99px;padding:9px 11px}.main{width:min(100%,630px);margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center}.hero{padding:22px 8px 28px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#45567a}h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.055em}h1{font-size:clamp(44px,10vw,78px);line-height:1.02;margin:16px 0 18px;font-weight:800}h2{font-size:clamp(24px,5vw,34px);line-height:1.18;margin:0;font-weight:800}h3{font-size:19px;margin:0}.lead{line-height:1.65;max-width:450px;color:#424e63;font-size:15px}.dark-panel{background:var(--ink);color:white;padding:25px;border-radius:28px;margin-bottom:12px}.dark-panel p{color:#bbc3d6;line-height:1.6}.yellow{background:var(--yellow)!important;color:var(--ink)!important}.action{border:0;border-radius:16px;padding:17px 18px;font-size:14px;font-weight:700;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:56px}.action:disabled{opacity:.35;cursor:not-allowed}.action.secondary{background:rgba(255,255,255,.63);color:var(--ink)}.action.full{width:100%}.meta{font-size:12px;color:#4f5b71}.progresswrap{height:7px;background:#aebbdc;border-radius:50px;overflow:hidden;margin:14px 0 28px}.progress{height:100%;background:var(--ink);transition:width .25s}.qhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px}.pill{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:#eef1fb;color:#47536b;border-radius:40px;padding:10px 12px}.question-card{background:var(--cream);border-radius:28px;padding:22px 18px 18px;box-shadow:0 10px 40px #7c8fbe1c}.qcontext{font-size:13px;line-height:1.6;color:#485673;margin:0 0 15px}.options{display:grid;gap:10px;margin-top:22px}.option{display:flex;align-items:flex-start;gap:13px;text-align:left;background:white;border:1.5px solid #e5e8f0;border-radius:17px;padding:15px 13px;min-height:75px;transition:.15s}.option:hover{border-color:#8799bc}.option[aria-pressed=true]{border-color:var(--ink);background:var(--yellow)}.letter{flex:none;width:30px;height:30px;border-radius:9px;background:#e9eef7;display:grid;place-items:center;font-size:12px;font-weight:800}.option[aria-pressed=true] .letter{background:var(--ink);color:white}.optext{font-size:14px;line-height:1.55}.footer-controls{display:flex;gap:10px;margin-top:16px}.footer-controls .action{flex:1}.disclaimer{font-size:11px;color:#536078;line-height:1.5;margin:14px 4px}.results-head{background:var(--ink);color:#fff;padding:25px 21px;border-radius:25px;margin:5px 0 13px}.results-head .eyebrow{color:#f4e196}.results-head h2{font-size:31px;margin:15px 0}.results-head p{font-size:14px;color:#bfc6d6;line-height:1.6}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border-radius:18px;padding:16px}.stat strong{display:block;font:800 29px Manrope;letter-spacing:-.07em}.stat span{font-size:12px;color:#5d687b}.section{margin:22px 0 10px;font-family:Manrope;font-size:18px;font-weight:800;letter-spacing:-.04em}.review{display:grid;gap:8px}.review-item{border:0;text-align:left;background:#f7f8fc;padding:15px;border-radius:16px}.review-item strong{display:block;font-size:13px;margin-bottom:5px;line-height:1.5}.review-item span{font-size:12px;color:#61708a;line-height:1.5}.barlabel{font-size:12px;font-weight:700;margin:14px 0 5px;display:flex;justify-content:space-between}.bar{background:#b7c3df;border-radius:20px;height:9px;overflow:hidden}.bar i{display:block;background:#242934;height:100%;border-radius:20px}.smallnote{font-size:12px;color:#515f77;line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.ghost{border:0;background:transparent;font-size:12px;font-weight:700;color:#28334c;padding:9px}.question-count{font-family:Manrope;font-size:12px;font-weight:800}.empty{padding:25px;background:white;border-radius:18px}.fade{animation:fade .23s ease}@keyframes fade{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(min-width:800px){.shell{padding:30px}.question-card{padding:30px}.optext{font-size:15px}.option{padding:18px}.footer-controls{margin-top:18px}}@media(max-width:370px){h2{font-size:23px}.question-card{padding:18px 13px}.optext{font-size:13px}.option{padding:12px 10px;gap:10px}.pill{font-size:9px}}

.party-reveal{background:#f4e196;color:#17191e;border-radius:29px;padding:24px 21px 21px;margin:8px 0 14px;overflow:hidden;position:relative;isolation:isolate}.party-reveal:before{content:"";position:absolute;width:235px;height:235px;background:#fff8cf;border-radius:50%;right:-65px;top:45px;z-index:-1}.party-reveal .eyebrow{font-size:10px;color:#4c4c49;letter-spacing:.14em}.party-reveal h2{font-size:clamp(27px,7vw,40px);line-height:1.09;margin:16px 0 21px;max-width:520px}.party-reveal h2 em{font-style:normal;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}.party-id{display:flex;align-items:center;gap:15px;padding:17px;background:#fffdf3;border:1px solid #eadfa4;border-radius:20px}.party-art{position:relative;flex:none;width:80px;height:80px;border-radius:50%;background:#c9d4f2;display:grid;place-items:center;overflow:hidden}.party-art:after{content:"";position:absolute;bottom:0;width:52px;height:48px;border-radius:52% 52% 0 0;background:#3d4763}.party-art:before{content:"";position:absolute;top:15px;width:34px;height:36px;border-radius:50%;background:#f1caa8;z-index:1}.party-flag{position:absolute;right:-4px;bottom:0;z-index:2;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#17191e;color:#fff;border:3px solid #fffdf3;font-size:15px}.party-name{font:800 21px Manrope,sans-serif;letter-spacing:-.05em;line-height:1.15}.party-caption{font-size:12px;color:#626775;line-height:1.45;margin-top:5px}.pilot-note{font-size:12px;line-height:1.55;margin:12px 2px 0;color:#4d5362}.party-reveal .party-note{font-size:11px;line-height:1.5;margin-top:11px;color:#5c593f}@media(min-width:600px){.party-reveal{padding:30px}.party-art{width:96px;height:96px}}@media(max-width:370px){.party-reveal h2{font-size:25px}.party-id{padding:12px}.party-art{width:68px;height:68px}.party-name{font-size:19px}}
</style></head><body><div id="app"></div><script>
const questions=[
{topic:'JUSTICIA SOCIAL',q:'¿Cuál de estas situaciones te preocupa más de nuestra sociedad?',a:['Que muchas personas, pese a trabajar y esforzarse, no tengan salarios suficientes ni un acceso adecuado a derechos básicos como la sanidad o la vivienda.','Que algunas personas disfruten de derechos y prestaciones sociales sin contribuir a la sociedad en la medida en que podrían hacerlo.','Que no estemos garantizando los recursos y las condiciones necesarias para mantener esos derechos y prestaciones para las generaciones futuras.'],tags:['igualdad','responsabilidad','futuro']},
{topic:'VIVIENDA',q:'Ante la escasez de vivienda y de trabajadores para construirla, ¿qué solución priorizarías?',a:['Aumentar la construcción, facilitando la llegada de trabajadores del extranjero y planificando también las viviendas y servicios que necesitarán.','Invertir en formación, mejores condiciones laborales e industrialización de la construcción, aunque los resultados tarden más en llegar.','Respaldar un objetivo ambicioso de construcción de vivienda, aunque los detalles de su ejecución no se hayan explicado.'],tags:['expansion','capacidad','ambicion']},
{topic:'IA Y DESEMPLEO',q:'Ante la posibilidad de que la inteligencia artificial deje sin empleo a una parte importante de la población, ¿qué medida política apoyarías?',a:['Reducir las indemnizaciones por despido y las prestaciones por desempleo para evitar que un aumento del paro comprometa las finanzas públicas.','Mantener las indemnizaciones por despido y las prestaciones por desempleo actuales, garantizando la protección de quienes pierdan su trabajo.','Aumentar las indemnizaciones y la protección por desempleo, aunque eso exija incrementar los impuestos o buscar nuevas fuentes de financiación.'],tags:['austeridad','continuidad','proteccion']},
{topic:'SANIDAD PÚBLICA',q:'Si las listas de espera sanitarias siguen creciendo y el presupuesto es limitado, ¿qué medida apoyarías?',a:['Aumentar los impuestos necesarios para contratar más personal sanitario y ampliar la capacidad de los hospitales públicos.','Fomentar la contratación de seguros médicos privados y facilitar el acceso a centros sanitarios privados, financiados por los propios usuarios, para reducir la presión sobre la sanidad pública sin aumentar el gasto del Estado.','Invertir en educación científica, alimentaria y deportiva para reducir el consumo de tabaco, alcohol y alimentos poco saludables, fomentar el ejercicio físico y prevenir enfermedades, al tiempo que se forman más médicos para reducir la presión sanitaria a largo plazo.'],tags:['publico','privado','prevencion']},
{topic:'FEMINISMO E IGUALDAD',q:'Si las mujeres siguen estando infrarrepresentadas en determinados puestos de responsabilidad, ¿qué medida apoyarías?',a:['Establecer cuotas mínimas de representación femenina para corregir los desequilibrios, aunque en algunos casos se limite la libertad de selección de las empresas.','Garantizar procesos de selección basados exclusivamente en méritos y capacidades, sin establecer cuotas por sexo, aunque las diferencias de representación persistan.','Investigar primero por qué hay menos mujeres en determinados puestos de responsabilidad y actuar únicamente cuando existan evidencias de discriminación, sin asumir que toda diferencia de representación implica desigualdad de oportunidades.'],tags:['cuotas','merito','investigacion']},
{topic:'INCENDIOS Y MEDIOAMBIENTE',q:'Ante los grandes incendios forestales y el abandono del medio rural, ¿qué política apoyarías?',a:['Aplicar criterios para recuperar la población rural, fomentar la educación ambiental y alimentaria e impulsar una ganadería extensiva que ayude a controlar la vegetación y prevenir incendios.','Favorecer la caza regulada, la ganadería y el aprovechamiento económico de los montes, dando mayor protagonismo a propietarios y habitantes rurales en su conservación.','Aumentar la inversión pública, financiada con impuestos, para contratar personal forestal, limpiar y gestionar los montes, restaurar ecosistemas y mantener equipos de prevención durante todo el año.'],tags:['rural','aprovechamiento','publico']},
{topic:'CEUTA E INMIGRACIÓN',q:'Ante los intentos de entrada irregular por la frontera de Ceuta, ¿qué medidas debería priorizar el Gobierno?',a:['Reforzar las vallas y la vigilancia fronteriza, recurriendo al Ejército cuando sea necesario para impedir entradas irregulares, dentro de los límites legales.','Priorizar el diálogo, la acogida humanitaria y la integración, destinando más recursos públicos a atender a quienes llegan y tramitar sus solicitudes.','Invertir en cooperación con los países de origen, combatir las redes de tráfico de personas y establecer vías legales de migración, buscando reducir las entradas irregulares antes de que se produzcan.'],tags:['control','acogida','cooperacion']},
{topic:'ABORTO Y DERECHOS REPRODUCTIVOS',q:'¿Hasta dónde debería intervenir el Estado en la decisión de una mujer de interrumpir su embarazo?',a:['Garantizar el aborto libre y gratuito dentro de los plazos legales, sin requisitos adicionales, respetando la decisión de la mujer.','Prohibir el aborto voluntario salvo en circunstancias excepcionales, priorizando la protección de la vida desde el embarazo.','Permitir el aborto durante las primeras semanas, pero establecer límites temporales más estrictos y asesoramiento previo obligatorio, salvo por motivos médicos graves.'],tags:['autonomia','restriccion','condiciones']},
{topic:'ENERGÍA Y MEDIOAMBIENTE',q:'La transición energética reduce emisiones, pero también transforma paisajes y consume recursos naturales. ¿Qué política priorizarías?',a:['Acelerar la instalación de parques solares y eólicos, aunque implique ocupar terrenos rurales y transformar determinados paisajes para sustituir cuanto antes los combustibles fósiles.','Priorizar el precio y la estabilidad del suministro, manteniendo las centrales nucleares y otras fuentes convencionales mientras se desarrollan nuevas alternativas.','Reducir el consumo energético mediante educación, eficiencia, rehabilitación de edificios y cambios en los hábitos de consumo, evitando nuevas instalaciones que dañen innecesariamente los ecosistemas.'],tags:['renovables','suministro','sobriedad']},
{topic:'CAMBIO CLIMÁTICO',q:'Ante el cambio climático, ¿qué cambios estarías dispuesto a apoyar para reducir nuestro impacto sobre el planeta?',a:['Reducir el consumo innecesario: comer menos carne, reutilizar productos que todavía funcionan, reparar antes de comprar y educar sobre el impacto ambiental de nuestros hábitos.','Invertir en energías renovables, electrificación e innovación tecnológica para reducir las emisiones sin renunciar al crecimiento económico y al consumo actual.','Priorizar el crecimiento industrial, la energía asequible y la competitividad frente a países como China, manteniendo combustibles fósiles y centrales nucleares mientras resulte necesario, aunque se retrase la reducción de emisiones.'],tags:['sobriedad','tecnologia','crecimiento']},
{topic:'VIOLENCIA DE GÉNERO',q:'Ante la violencia contra las mujeres en el ámbito de la pareja, ¿qué política debería priorizar el Estado?',a:['Reforzar las leyes específicas contra la violencia de género, aumentando los recursos para proteger a las víctimas, perseguir a los agresores y prevenir nuevas agresiones.','Establecer un mismo marco legal para toda violencia en el ámbito familiar o de pareja, independientemente del sexo de la víctima o del agresor, garantizando protección según el riesgo de cada caso.','Investigar científicamente los factores que favorecen la violencia en las relaciones de pareja y destinar los recursos públicos a las medidas de prevención, detección y protección que demuestren mayor eficacia, evaluando sus resultados periódicamente.'],tags:['leyes','igualdadlegal','evidencia']},
{topic:'IMPUESTOS Y SERVICIOS PÚBLICOS',q:'Si queremos mejorar la sanidad, la educación y los servicios públicos, pero el dinero disponible no es suficiente, ¿qué medida apoyarías?',a:['Aumentar los impuestos, especialmente a quienes tienen mayores ingresos y patrimonio, para financiar mejores servicios públicos.','Mantener o reducir los impuestos, recortando gastos en otras áreas de la Administración y destinando esos recursos a los servicios esenciales.','Regular determinados hábitos de consumo perjudiciales para la salud y el medioambiente, mediante medidas educativas, preventivas y administrativas, para reducir el uso evitable de recursos públicos y disminuir el gasto a largo plazo.'],tags:['impuestos','reordenar','prevencion']},
{topic:'CATÁSTROFES NATURALES',q:'Tras una catástrofe como la DANA de Valencia, ¿qué medidas apoyarías para evitar que vuelva a ocurrir una tragedia semejante?',a:['Endurecer las normas urbanísticas basándose en estudios científicos, prohibir construir en zonas de alto riesgo y trasladar viviendas existentes cuando no sea posible garantizar su seguridad, aunque afecte a propietarios y empresas.','Aumentar los impuestos necesarios para financiar infraestructuras de protección, servicios de emergencia y ayudas públicas a los damnificados, garantizando que nadie tenga que afrontar solo las consecuencias.','Priorizar la construcción de presas y defensas hidráulicas, agilizar las obras y reducir las trabas administrativas, aunque algunas actuaciones tengan impacto ambiental, para proteger poblaciones y actividades económicas.'],tags:['prevencion','solidaridad','infraestructura']},
{topic:'CORRUPCIÓN Y TRANSPARENCIA',q:'Si un partido político está implicado en casos graves de corrupción, pero su Gobierno mantiene buenos resultados económicos y sociales, ¿qué debería ocurrir?',a:['Exigir la dimisión de los responsables políticos ante indicios sólidos de corrupción, aunque eso provoque la caída del Gobierno y nuevas elecciones.','Mantener al Gobierno si es el partido al que he votado, al menos hasta que la Justicia demuestre su responsabilidad en los casos de corrupción, aunque existan indicios sólidos.','Someter al Gobierno a una auditoría externa e independiente, publicar contratos y financiación, y decidir sobre su continuidad según los hechos acreditados, aunque el proceso tenga un coste público.'],tags:['rendicion','lealtad','auditoria']},
{topic:'DEMOCRACIA Y CONOCIMIENTO',q:'Si la mayoría de la población apoya una decisión que los estudios científicos consideran perjudicial, ¿quién debería tener la última palabra?',a:['La ciudadanía. En democracia, la voluntad de la mayoría debe prevalecer, incluso cuando contradiga las recomendaciones de los expertos.','Los especialistas independientes deberían poder impedir decisiones que supongan riesgos graves y demostrados para la sociedad.','Los representantes democráticos deberían decidir, pero haciendo públicos los informes científicos y justificando cualquier decisión contraria a sus conclusiones.'],tags:['mayoria','expertos','rendicion']},
];
const KEY='enquecrees_v2_15';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let state={screen:'home',index:0,answers:Array.isArray(saved.answers)&&saved.answers.length===questions.length?saved.answers:Array(questions.length).fill(null)};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify({answers:state.answers}))}catch{}}function shell(content){app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><span></span>en qué crees<span style="width:auto;height:auto;background:none;margin:0">.</span></div><div class="mini">Edición piloto · 15</div></header><main class="main fade">${content}</main></div>`}function home(){const count=state.answers.filter(x=>x!==null).length;shell(`<div class="hero"><div class="eyebrow">Un pequeño experimento de ideas</div><h1>Piensa.<br>Elige.<br><em style="font-style:normal;color:#5d70a0">Duda.</em></h1><p class="lead">15 dilemas sobre el mundo en el que vivimos. Tres respuestas por pregunta. Sin nombres de partidos, sin resultados intermedios y sin respuestas correctas.</p></div><div class="dark-panel"><div class="eyebrow" style="color:var(--yellow)">15 preguntas · 6–10 minutos</div><h3 style="margin-top:12px">Tus convicciones, sin etiquetas.</h3><p>Al terminar podrás revisar todas tus elecciones. Esta versión sirve para probar y auditar las preguntas.</p><button class="action yellow full" onclick="start()">${count?'Continuar encuesta':'Empezar encuesta'} <span>↗</span></button></div><div class="meta" style="padding:8px">Sin cuentas ni datos enviados a servidores. Tu progreso se guarda solo en este dispositivo.</div>`)}function start(){let i=state.answers.findIndex(x=>x===null);state.index=i===-1?0:i;state.screen='quiz';render()}function quiz(){const q=questions[state.index],sel=state.answers[state.index];shell(`<div class="qhead"><div class="eyebrow">Tu punto de vista</div><span class="question-count">${String(state.index+1).padStart(2,'0')} / 15</span></div><div class="progresswrap"><div class="progress" style="width:${((state.index+1)/questions.length*100)}%"></div></div><section class="question-card"><div class="row"><span class="pill">${esc(q.topic)}</span><span class="meta">Elige una</span></div>${q.context?`<p class="qcontext" style="margin-top:18px">${esc(q.context)}</p>`:''}<h2 style="margin-top:20px">${esc(q.q)}</h2><div class="options">${q.a.map((a,i)=>`<button class="option" aria-pressed="${sel===i}" onclick="choose(${i})"><span class="letter">${'ABC'[i]}</span><span class="optext">${esc(a)}</span></button>`).join('')}</div></section><div class="footer-controls"><button class="action secondary" onclick="prev()">← Atrás</button><button class="action" ${sel===null?'disabled':''} onclick="next()">${state.index===questions.length-1?'Ver resultado':'Siguiente'} <span>→</span></button></div><div class="disclaimer">Tus respuestas no se interpretan durante el cuestionario. Puedes volver atrás y cambiarlas.</div>`)}function choose(i){state.answers[state.index]=i;save();quiz()}function prev(){if(state.index===0){state.screen='home'}else{state.index--}render()}function next(){if(state.answers[state.index]===null)return;if(state.index===questions.length-1){state.screen='results'}else state.index++;render()}function pct(n){return Math.round(n/questions.length*100)}function results(){const complete=state.answers.filter(x=>x!==null).length;if(complete<questions.length){state.screen='quiz';state.index=state.answers.findIndex(x=>x===null);return quiz()}const counts=[0,0,0];state.answers.forEach(a=>counts[a]++);let sections=[{label:'Respuestas A',v:counts[0]},{label:'Respuestas B',v:counts[1]},{label:'Respuestas C',v:counts[2]}];shell(`<section class="party-reveal"><div class="eyebrow">Tu resultado · 15 preguntas</div><h2>Aunque de todos los partidos, solo <em>XX han tenido la decencia de publicar su programa electoral</em>, creemos que el partido que más se acerca a tus prioridades es...</h2><div class="party-id"><div style="position:relative"><div class="party-art" aria-label="Silueta de marcador de posición"></div><span class="party-flag" aria-hidden="true">⚑</span></div><div><div class="party-name">Por determinar</div><div class="party-caption">Aquí aparecerán el líder y el símbolo del partido cuando verifiquemos las propuestas y calculemos las coincidencias.</div></div></div><div class="party-note">Vista previa de diseño · XX es un marcador de posición, no un dato verificado.</div></section><div class="results-head"><div class="eyebrow">Cuestionario completado</div><h2>15 decisiones.<br>Un montón de matices.</h2><p>Estas son las respuestas que has elegido. No interpretamos A, B y C como ideologías: su significado cambia en cada pregunta.</p></div><div class="stats"><div class="stat"><strong>15/15</strong><span>Preguntas respondidas</span></div><div class="stat"><strong>100%</strong><span>Tu recorrido completado</span></div></div><div class="section">Distribución de tus respuestas</div><div style="background:#f7f8fc;padding:17px;border-radius:20px">${sections.map(s=>`<div class="barlabel"><span>${s.label}</span><span>${pct(s.v)}%</span></div><div class="bar"><i style="width:${pct(s.v)}%"></i></div>`).join('')}<p class="smallnote">Estos porcentajes son únicamente un recuento de letras. No indican coincidencia con partidos ni rigor científico.</p></div><div class="section">Audita tus 15 respuestas</div><div class="review">${questions.map((q,i)=>`<button class="review-item" onclick="jump(${i})"><strong>${String(i+1).padStart(2,'0')}. ${esc(q.q)}</strong><span>Tu respuesta: ${'ABC'[state.answers[i]]} · ${esc(q.a[state.answers[i]])}</span></button>`).join('')}</div><div style="margin-top:20px;display:grid;gap:10px"><button class="action full" onclick="copyReview()">Copiar mis respuestas para la auditoría <span>↗</span></button><button class="action secondary full" onclick="restart()">Volver a empezar <span>↻</span></button></div><p class="smallnote" style="padding:12px 2px">Versión piloto. Las comparaciones porcentuales con partidos se añadirán únicamente cuando haya correspondencias documentadas entre propuestas y respuestas. Esta versión no recomienda un voto.</p>`)}function jump(i){state.index=i;state.screen='quiz';render()}function copyReview(){let str='AUDITORÍA — EN QUÉ CREES\n\n'+questions.map((q,i)=>`${i+1}. ${q.q}\n${'ABC'[state.answers[i]]}. ${q.a[state.answers[i]]}`).join('\n\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(str).then(()=>alert('Respuestas copiadas. Pégalas en el chat para revisarlas.')).catch(()=>fallback(str))}else fallback(str)}function fallback(str){let t=document.createElement('textarea');t.value=str;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Respuestas copiadas.')}function restart(){if(!confirm('¿Quieres borrar las respuestas y empezar de nuevo?'))return;state.answers=Array(questions.length).fill(null);state.screen='home';save();render()}function render(){window.scrollTo(0,0);if(state.screen==='home')home();else if(state.screen==='quiz')quiz();else results()}window.start=start;window.choose=choose;window.prev=prev;window.next=next;window.jump=jump;window.restart=restart;window.copyReview=copyReview;render();
</script></body></html>
