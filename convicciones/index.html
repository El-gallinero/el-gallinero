/* Dirección editorial: tipografía de licencia abierta Google Fonts, interfaz sin estilo dibujado */
:root{--lav:#F3F0E8;--cream:#F0E9DA;--yellow:#E9DDB4;--ink:#111111;--muted:#414141;--line:#111111;--white:#F7F3EB}
html,body,.shell{background:#F3F0E8}
body,button{font-family:'Archivo',Arial,sans-serif}
.shell{padding:20px 18px max(26px,env(safe-area-inset-bottom))}
.top{max-width:690px;margin-bottom:15px}
.brand{font:900 18px 'Archivo',sans-serif;letter-spacing:-.06em;text-transform:lowercase}
.mini{border:1px solid #111;border-radius:0;padding:9px 11px;color:#111;font-size:10px}
.main{max-width:690px}
h1,h2,h3,.section,.party-name{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-.055em}
h1{font-size:clamp(45px,11.2vw,80px);line-height:.97;font-weight:900;margin:12px 0 16px}
h2{font-size:clamp(25px,6vw,37px);line-height:1.11}
.hero{padding:15px 0 10px}
.hero .eyebrow,.eyebrow{color:#111}
.lead{color:#222;font-size:15px;line-height:1.48;max-width:560px}
.action{border:2px solid #111;border-radius:8px;background:#111;color:#F7F3EB;min-height:58px;padding:16px 18px;font-weight:800;font-size:14px;box-shadow:none;transition:transform .12s ease,background .12s ease}
.action:hover{transform:translateY(-1px)}
.action:active{transform:translateY(1px)}
.action.secondary{background:transparent;color:#111}
.action.yellow{background:#111!important;color:#fff!important}
.dark-panel{background:transparent;color:#111;padding:0;border-radius:0;margin:20px 0 0}
.dark-panel p{color:#3b3b3b}
.question-card{background:#EAE4D8;border:2px solid #111;border-radius:10px;padding:22px 19px;box-shadow:none}
.option{background:transparent;border:2px solid #111;border-radius:8px;min-height:80px;gap:13px;padding:17px 14px}
.option:hover{background:#F7F3EB;border-color:#111}
.option[aria-pressed=true]{background:#EBDFAE}
.letter{border:2px solid #111;border-radius:4px;background:transparent;min-width:32px;min-height:32px;font-size:13px}
.option[aria-pressed=true] .letter{background:#111;color:#fff}
.pill{background:#D8D7CD;border:1px solid #111;border-radius:0;color:#111}
.progresswrap{background:#D5D0C6;height:6px;border-radius:0}
.progress{background:#111}
.footer-controls{gap:9px}
.disclaimer,.meta,.qcontext{color:#424242}
.results-head{border:2px solid #111;border-radius:9px;background:#D9D9CE;color:#111}
.results-head .eyebrow,.results-head p{color:#111}
.stat{background:#E9E1D4;border:2px solid #111;border-radius:7px}
.review-item{background:#EAE4D8;border:2px solid #111;border-radius:7px}
.review-item span{color:#333}
.party-reveal{background:#E9DDB4;border:2px solid #111;border-radius:9px}
.party-id{background:#F2EBCF;border:2px solid #111;border-radius:7px}
.party-art,.party-flag{border:2px solid #111}
.bar,.bar i{border-radius:0}
.pilot-note,.party-note{color:#333}
.home-visual{display:flex;align-items:center;justify-content:center;margin:7px 0 12px;min-height:190px}
.home-visual svg{width:min(100%,465px);height:auto;display:block}
.home-buttons{display:grid;gap:9px;margin-top:16px}
.home-buttons .action{width:100%}
.home-small{font-size:12px;line-height:1.55;margin-top:13px;color:#393939}
.hero-em{display:block;background:#E6DDC0;color:#111;width:max-content;max-width:100%;padding:4px 10px 7px;font-style:normal}
@media(min-width:800px){.shell{padding:32px}.question-card{padding:30px}.home-visual{margin:15px 0}}
@media(max-width:400px){h1{font-size:clamp(43px,11.8vw,56px)}.hero{padding:9px 0 5px}.home-visual{min-height:150px}.option{padding:13px 11px}.question-card{padding:19px 13px}}

.progresswrap{max-width:420px;margin:11px auto 24px;height:6px;border-radius:100px;background:#E4E1ED}
.progress{border-radius:100px;background:#F1CB66}
.question-card{background:transparent!important;border:none!important;padding:0!important;overflow:visible!important;box-shadow:none!important}
.question-banner{background:#DAD8F6;border-radius:23px;padding:clamp(24px,5vw,34px) clamp(19px,5vw,34px);position:relative}
.question-topic{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#3F3C57;margin-bottom:16px}
.question-banner h2{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(23px,5.3vw,35px);line-height:1.16;letter-spacing:-.038em;margin:0!important;text-align:center}
.question-banner .qcontext{margin:16px auto 0!important;text-align:center;font-size:12px;line-height:1.5}
.question-art{display:flex;justify-content:flex-end;max-height:96px;margin:2px 18px 3px;pointer-events:none}
.question-art .topic-art{position:static!important;opacity:1!important;width:140px!important;height:94px!important;margin:0!important}
.question-art .topic-art svg{height:100%;width:100%}
.options{display:grid;gap:11px;margin-top:11px}
.option{width:100%;min-height:0;height:auto;border:1px solid transparent!important;border-radius:19px!important;display:flex;align-items:center;gap:12px;padding:17px 17px!important;background:#F4EEEA!important;text-align:left;box-shadow:none}
.option:nth-child(2){background:#E1F0F7!important}
.option:nth-child(3){background:#E5E2FA!important}
.option[aria-pressed="true"]{background:#F9E8A7!important;border-color:#9F873F!important}
.option .letter{width:21px;min-width:21px;height:24px;min-height:24px;border:none!important;background:transparent!important;font-size:11px;font-weight:700;border-radius:0;color:#2B2B2B!important;display:grid;place-items:center}
.option .optext{flex:1;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(13px,3.3vw,15px);line-height:1.47;letter-spacing:-.01em;font-weight:500}
.radio-dot{flex:0 0 23px;width:23px;height:23px;border:2px solid #171717;border-radius:50%;margin-left:2px;position:relative}
.option[aria-pressed="true"] .radio-dot:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#171717}
.footer-controls{margin-top:21px}
.footer-controls .continue-action{background:#F7E7AE;color:#111;border:1.5px solid #111;border-radius:999px;justify-content:space-between}
.footer-controls .continue-action:disabled{background:#E7E5E0;opacity:.55}
@media(max-width:699px){
 .shell:has(.question-card){padding:13px 18px max(23px,env(safe-area-inset-bottom))}
 .qhead{min-height:50px;justify-content:center!important;padding-right:0!important}
 .qhead .question-count{position:static!important;transform:none!important;text-align:center;font-size:20px}
 .quiz-back{left:0}
 .progresswrap{margin:10px auto 20px}
 .question-banner{padding:24px 20px}
 .question-banner h2{text-align:center!important;font-size:clamp(22px,5.6vw,29px);max-width:100%!important}
 .question-art{max-height:78px;margin:0 13px 2px}
 .question-art .topic-art{height:75px!important;width:120px!important}
 .options{margin-top:8px;gap:10px}
 .option{padding:16px 14px!important;min-height:0!important}
 .option .optext{font-size:13.5px;line-height:1.43}
 .footer-controls{margin-top:18px}
 .footer-controls .footer-back{display:none}
 .footer-controls .continue-action{min-height:54px}
}

const questions=[
{topic:'JUSTICIA SOCIAL',q:'¿Cuál de estas situaciones te preocupa más de nuestra sociedad?',a:['Que muchas personas, pese a trabajar y esforzarse, no tengan salarios suficientes ni un acceso adecuado a derechos básicos como la sanidad o la vivienda.','Que algunas personas disfruten de derechos y prestaciones sociales sin contribuir a la sociedad en la medida en que podrían hacerlo.','Que no estemos garantizando los recursos y las condiciones necesarias para mantener esos derechos y prestaciones para las generaciones futuras.'],tags:['igualdad','responsabilidad','futuro']},
{topic:'VIVIENDA',q:'Ante la escasez de vivienda y de trabajadores para construirla, ¿qué solución priorizarías?',a:['Aumentar la construcción, facilitando la llegada de trabajadores del extranjero y planificando también las viviendas y servicios que necesitarán.','Invertir en formación, mejores condiciones laborales e industrialización de la construcción, aunque los resultados tarden más en llegar.','Respaldar un objetivo ambicioso de construcción de vivienda, aunque los detalles de su ejecución no se hayan explicado.'],tags:['expansion','capacidad','ambicion']},
{topic:'IA Y DESEMPLEO',q:'Ante la posibilidad de que la inteligencia artificial deje sin empleo a una parte importante de la población, ¿qué medida política apoyarías?',a:['Reducir las indemnizaciones por despido y las prestaciones por desempleo para evitar que un aumento del paro comprometa las finanzas públicas.','Mantener las indemnizaciones por despido y las prestaciones por desempleo actuales, garantizando la protección de quienes pierdan su trabajo.','Aumentar las indemnizaciones y la protección por desempleo, aunque eso exija incrementar los impuestos o buscar nuevas fuentes de financiación.'],tags:['austeridad','continuidad','proteccion']},
{topic:'SANIDAD PÚBLICA',q:'Si las listas de espera sanitarias siguen creciendo y el presupuesto es limitado, ¿qué medida apoyarías?',a:['Aumentar los impuestos necesarios para contratar más personal sanitario y ampliar la capacidad de los hospitales públicos.','Fomentar la contratación de seguros médicos privados y facilitar el acceso a centros sanitarios privados, financiados por los propios usuarios, para reducir la presión sobre la sanidad pública sin aumentar el gasto del Estado.','Invertir en educación científica, alimentaria y deportiva para reducir el consumo de tabaco, alcohol y alimentos poco saludables, fomentar el ejercicio físico y prevenir enfermedades, al tiempo que se forman más médicos para reducir la presión sanitaria a largo plazo.'],tags:['publico','privado','prevencion']},
{topic:'FEMINISMO E IGUALDAD',q:'Si las mujeres siguen estando infrarrepresentadas en determinados puestos de responsabilidad, ¿qué medida apoyarías?',a:['Establecer cuotas mínimas de representación femenina para corregir los desequilibrios, aunque en algunos casos se limite la libertad de selección de las empresas.','Garantizar procesos de selección basados exclusivamente en méritos y capacidades, sin establecer cuotas por sexo, aunque las diferencias de representación persistan.','Investigar primero por qué hay menos mujeres en determinados puestos de responsabilidad y actuar únicamente cuando existan evidencias de discriminación, sin asumir que toda diferencia de representación implica desigualdad de oportunidades.'],tags:['cuotas','merito','investigacion']},
{topic:'INCENDIOS Y MEDIOAMBIENTE',q:'Ante los grandes incendios forestales y el abandono del medio rural, ¿qué política apoyarías?',a:['Aplicar criterios para recuperar la población rural, fomentar la educación ambiental y alimentaria e impulsar una ganadería extensiva que ayude a controlar la vegetación y prevenir incendios.','Favorecer la caza regulada, la ganadería y el aprovechamiento económico de los montes, dando mayor protagonismo a propietarios y habitantes rurales en su conservación.','Aumentar la inversión pública, financiada con impuestos, para contratar personal forestal, limpiar y gestionar los montes, restaurar ecosistemas y mantener equipos de prevención durante todo el año.'],tags:['rural','aprovechamiento','publico']},
{topic:'CEUTA E INMIGRACIÓN',q:'Ante los intentos de entrada irregular por la frontera de Ceuta, ¿qué medidas debería priorizar el Gobierno?',a:['Reforzar las vallas y la vigilancia fronteriza, recurriendo al Ejército cuando sea necesario para impedir entradas irregulares, dentro de los límites legales.','Priorizar el diálogo, la acogida humanitaria y la integración, destinando más recursos públicos a atender a quienes llegan y tramitar sus solicitudes.','Invertir en cooperación con los países de origen, combatir las redes de tráfico de personas y establecer vías legales de migración, buscando reducir las entradas irregulares antes de que se produzcan.'],tags:['control','acogida','cooperacion']},
{topic:'ABORTO Y DERECHOS REPRODUCTIVOS',q:'¿Hasta dónde debería intervenir el Estado en la decisión de una mujer de interrumpir su embarazo?',a:['Garantizar el aborto libre y gratuito dentro de los plazos legales, sin requisitos adicionales, respetando la decisión de la mujer.','Prohibir el aborto voluntario salvo en circunstancias excepcionales, priorizando la protección de la vida desde el embarazo.','Cubrir el primer aborto con financiación pública, ofreciendo acompañamiento psicológico e información y formación sobre salud sexual y anticoncepción. A partir del segundo, estudiar cada caso y valorar si debe seguir cubriéndolo la sanidad pública.'],tags:['autonomia','restriccion','condiciones']},
{topic:'ENERGÍA Y MEDIOAMBIENTE',q:'La transición energética puede reducir emisiones, pero las instalaciones también ocupan suelo rural, alteran ecosistemas y pueden generar contaminación durante su construcción y desmantelamiento. ¿Qué política priorizarías?',a:['Acelerar la instalación de parques solares y eólicos para sustituir cuanto antes los combustibles fósiles, aunque implique ocupar terrenos rurales y asumir determinados impactos sobre sus ecosistemas.','Priorizar el precio y la estabilidad del suministro, manteniendo las centrales nucleares y otras fuentes convencionales mientras se desarrollan nuevas alternativas.','Reducir el consumo energético mediante educación, eficiencia, rehabilitación de edificios y cambios en los hábitos de consumo, evitando nuevas instalaciones que dañen innecesariamente los ecosistemas.'],tags:['renovables','suministro','sobriedad']},
{topic:'CAMBIO CLIMÁTICO',q:'Ante el cambio climático, ¿qué cambios estarías dispuesto a apoyar para reducir nuestro impacto sobre el planeta?',a:['Reducir el consumo innecesario: comer menos carne, reutilizar productos que todavía funcionan, reparar antes de comprar y educar sobre el impacto ambiental de nuestros hábitos.','Invertir en energías renovables, electrificación e innovación tecnológica para reducir las emisiones sin renunciar al crecimiento económico y al consumo actual.','Priorizar el crecimiento industrial, la energía asequible y la competitividad frente a países como China, manteniendo combustibles fósiles y centrales nucleares mientras resulte necesario, aunque se retrase la reducción de emisiones.'],tags:['sobriedad','tecnologia','crecimiento']},
{topic:'VIOLENCIA DE GÉNERO',q:'Ante la violencia contra las mujeres en el ámbito de la pareja, ¿qué política debería priorizar el Estado?',a:['Reforzar las leyes específicas contra la violencia de género, aumentando los recursos para proteger a las víctimas, perseguir a los agresores y prevenir nuevas agresiones.','Establecer un mismo marco legal para toda violencia en el ámbito familiar o de pareja, independientemente del sexo de la víctima o del agresor, garantizando protección según el riesgo de cada caso.','Investigar científicamente los factores que favorecen la violencia en las relaciones de pareja y destinar los recursos públicos a las medidas de prevención, detección y protección que demuestren mayor eficacia, evaluando sus resultados periódicamente.'],tags:['leyes','igualdadlegal','evidencia']},
{topic:'IMPUESTOS Y SERVICIOS PÚBLICOS',q:'Si queremos mejorar la sanidad, la educación y los servicios públicos, pero el dinero disponible no es suficiente, ¿qué medida apoyarías?',a:['Aumentar los impuestos, especialmente a quienes tienen mayores ingresos y patrimonio, para financiar mejores servicios públicos.','Mantener o reducir los impuestos, recortando gastos en otras áreas de la Administración y destinando esos recursos a los servicios esenciales.','Regular determinados hábitos de consumo perjudiciales para la salud y el medioambiente, mediante medidas educativas, preventivas y administrativas, para reducir el uso evitable de recursos públicos y disminuir el gasto a largo plazo.'],tags:['impuestos','reordenar','prevencion']},
{topic:'CATÁSTROFES NATURALES',q:'Tras una catástrofe como la DANA de Valencia, ¿qué medidas apoyarías para evitar que vuelva a ocurrir una tragedia semejante?',a:['Endurecer las normas urbanísticas basándose en estudios científicos, prohibir construir en zonas de alto riesgo y trasladar viviendas existentes cuando no sea posible garantizar su seguridad, aunque afecte a propietarios y empresas.','Aumentar los impuestos necesarios para financiar infraestructuras de protección, servicios de emergencia y ayudas públicas a los damnificados, garantizando que nadie tenga que afrontar solo las consecuencias.','Priorizar la construcción de presas y defensas hidráulicas, agilizar las obras y reducir las trabas administrativas, aunque algunas actuaciones tengan impacto ambiental, para proteger poblaciones y actividades económicas.'],tags:['prevencion','solidaridad','infraestructura']},
{topic:'CORRUPCIÓN Y TRANSPARENCIA',q:'Si un partido político está implicado en casos graves de corrupción, pero su Gobierno mantiene buenos resultados económicos y sociales, ¿qué debería ocurrir?',a:['Exigir la dimisión de los responsables políticos ante indicios sólidos de corrupción, aunque eso provoque la caída del Gobierno y nuevas elecciones.','Mantener al Gobierno si es el partido al que he votado, al menos hasta que la Justicia demuestre su responsabilidad en los casos de corrupción, aunque existan indicios sólidos.','Someter al Gobierno a una auditoría externa e independiente, publicar contratos y financiación, y decidir sobre su continuidad según los hechos acreditados, aunque el proceso tenga un coste público.'],tags:['rendicion','lealtad','auditoria']},
{topic:'DEMOCRACIA Y CONOCIMIENTO',q:'Si la mayoría de la población apoya una decisión que los estudios científicos consideran perjudicial, ¿quién debería tener la última palabra?',a:['La ciudadanía. En democracia, la voluntad de la mayoría debe prevalecer, incluso cuando contradiga las recomendaciones de los expertos.','Los especialistas independientes deberían poder impedir decisiones que supongan riesgos graves y demostrados para la sociedad.','Los representantes democráticos deberían decidir, pero haciendo públicos los informes científicos y justificando cualquier decisión contraria a sus conclusiones.'],tags:['mayoria','expertos','rendicion']},
];

function topicArt(i){return '<div class="topic-art" aria-hidden="true"><svg viewBox="0 0 300 195" xmlns="http://www.w3.org/2000/svg"><defs><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="3" seed="5" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/></filter></defs><g filter="url(#rough)" stroke="#171715" stroke-width="4.3" stroke-linejoin="round" stroke-linecap="round">'+topicDrawings[i]+'</g></svg></div>';}
const heroDrawing="<svg class=\"hero-illustration\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 375\" role=\"img\" aria-label=\"Caricatura editorial de personas de diferentes generaciones pensando\">\n<defs><filter id=\"pencil\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".024\" numOctaves=\"3\" seed=\"8\" result=\"gr\"/><feDisplacementMap in=\"SourceGraphic\" in2=\"gr\" scale=\"3\"/></filter></defs>\n<g stroke=\"#111\" stroke-width=\"5.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" filter=\"url(#pencil)\">\n<path d=\"M23 362q-10-96 59-124l48 15 31 108Z\" fill=\"#D1DCA9\"/><path d=\"M84 261q-39-15-48-75-10-83 52-105 71-21 95 77 13 62-26 93Z\" fill=\"#F3A7AE\"/><path d=\"M25 177Q4 95 55 77q8-37 41-25 48-20 61 24 31 8 25 54l-19-5-31-37-42 29-51 3Z\" fill=\"#B2B0AA\"/><path d=\"M41 178q18-17 43-4M100 169q23-17 43-3\" fill=\"none\"/><ellipse cx=\"73\" cy=\"181\" rx=\"16\" ry=\"11\" fill=\"#fff\"/><ellipse cx=\"123\" cy=\"177\" rx=\"16\" ry=\"11\" fill=\"#fff\"/><circle cx=\"77\" cy=\"181\" r=\"7\" fill=\"#9CC6DF\"/><circle cx=\"126\" cy=\"177\" r=\"7\" fill=\"#9CC6DF\"/><path d=\"m97 170-8 42 22 4M93 233q27 13 51-8\" fill=\"none\"/><circle cx=\"52\" cy=\"215\" r=\"16\" fill=\"#E36C4C\"/><circle cx=\"145\" cy=\"213\" r=\"15\" fill=\"#E36C4C\"/>\n<path d=\"M154 371q-13-85 60-108l83-4q56 25 66 112Z\" fill=\"#F4EBD9\"/><path d=\"M194 243q-33-20-29-81 5-104 87-109 78-2 92 103 10 79-47 113Z\" fill=\"#F0A6B9\"/>\n<path d=\"M168 174q-25-47-10-82 1-28 23-27 0-42 43-26 28-48 64-12 23-12 30 24 39-12 42 26 36 9 16 43-16 8-30 1-24 27-44-8-31 24-49 2-23 25-42 4-11 34-43 35Z\" fill=\"#F8AA29\"/>\n<path d=\"M194 155q29-11 52 0M275 154q24-13 45 0\" fill=\"none\"/><ellipse cx=\"220\" cy=\"175\" rx=\"25\" ry=\"17\" fill=\"#fff\"/><ellipse cx=\"303\" cy=\"172\" rx=\"25\" ry=\"17\" fill=\"#fff\"/><circle cx=\"227\" cy=\"175\" r=\"12\" fill=\"#9CCFE8\"/><circle cx=\"310\" cy=\"172\" r=\"12\" fill=\"#9CCFE8\"/><circle cx=\"227\" cy=\"175\" r=\"6\" fill=\"#111\"/><circle cx=\"310\" cy=\"172\" r=\"6\" fill=\"#111\"/><path d=\"M196 154l-3-10m15 8-2-12m14 10-1-12m59 13-2-12m14 12-1-12m15 14v-14\" fill=\"none\" stroke-width=\"3\"/><path d=\"m270 174-9 54h26\" fill=\"#E36C4C\"/><path d=\"M241 245q25 15 55-2\" fill=\"none\"/><circle cx=\"197\" cy=\"214\" r=\"17\" fill=\"#E76850\" stroke=\"none\"/><circle cx=\"332\" cy=\"212\" r=\"17\" fill=\"#E76850\" stroke=\"none\"/><ellipse cx=\"184\" cy=\"220\" rx=\"13\" ry=\"17\" fill=\"#E5684D\"/><ellipse cx=\"344\" cy=\"211\" rx=\"14\" ry=\"18\" fill=\"#E5684D\"/><ellipse cx=\"182\" cy=\"230\" rx=\"10\" ry=\"19\" fill=\"none\" stroke=\"#2B9956\" stroke-width=\"7\"/><ellipse cx=\"349\" cy=\"222\" rx=\"10\" ry=\"19\" fill=\"none\" stroke=\"#2B9956\" stroke-width=\"7\"/>\n<path d=\"M218 277v94m66-98v98\" fill=\"none\"/><path d=\"M228 296h50m-50 21h50m-50 20h50\" fill=\"none\" stroke=\"#36AB6A\" stroke-width=\"8\"/><path d=\"M165 294l41-23-18 103M335 274l26 24 3 76\" fill=\"none\"/>\n<path d=\"M361 369q-11-81 31-111 46-16 71 29l13 82Z\" fill=\"#B3D6E4\"/><path d=\"M372 201q-20-48 8-90 32-29 65-11 32 24 28 83 2 52-30 69-58 19-71-51Z\" fill=\"#EFB4A5\"/><path d=\"M370 178q-23-84 38-92 57-15 72 69-38-12-57-46-23 37-53 37Z\" fill=\"#777879\"/><path d=\"M383 176h24M429 175h24\" fill=\"none\"/><circle cx=\"401\" cy=\"180\" r=\"8\" fill=\"#88BBD9\"/><circle cx=\"443\" cy=\"178\" r=\"8\" fill=\"#88BBD9\"/><path d=\"m423 177-3 31 15 4M407 230q22 11 40-3\" fill=\"none\"/><circle cx=\"380\" cy=\"206\" r=\"12\" fill=\"#E36C4C\" stroke=\"none\"/><circle cx=\"457\" cy=\"206\" r=\"12\" fill=\"#E36C4C\" stroke=\"none\"/>\n</g></svg>";const KEY='enquecrees_v2_15';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let state={screen:'home',index:0,answers:Array.isArray(saved.answers)&&saved.answers.length===questions.length?saved.answers:Array(questions.length).fill(null)};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify({answers:state.answers}))}catch{}}function shell(content){app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><span></span>en qué crees<span style="width:auto;height:auto;background:none;margin:0">.</span></div><div class="mini">Edición piloto · 15</div></header><main class="main fade">${content}</main></div>`}function home(){const count=state.answers.filter(x=>x!==null).length;shell(`<div class="hero"><h1>¿No sabes a<br>quién votar?</h1><h2 class="hero-em">Te ayudamos.</h2><p class="lead">Responde 15 preguntas y descubre qué propuestas se acercan más a tus ideas, valores e inquietudes.</p></div><div class="hero-drawing">${heroDrawing}</div><div class="home-buttons"><button class="action full" onclick="start()"><span>${count?'Continuar cuestionario':'Empezar cuestionario'}</span>${iconArrow}</button></div>`)}function explain(){alert('Responde las 15 preguntas eligiendo A, B o C. Puedes volver atrás para cambiar tu respuesta. Al finalizar podrás revisar todas tus elecciones. La comparación con programas electorales todavía está en desarrollo.')}function start(){let i=state.answers.findIndex(x=>x===null);state.index=i===-1?0:i;state.screen='quiz';render()}function quiz(){const q=questions[state.index],sel=state.answers[state.index];shell(`<div class="qhead"><button type="button" class="quiz-back" onclick="prev()" aria-label="Volver a la pregunta anterior">${iconBack}</button><span class="question-count">${state.index+1} de ${questions.length}</span></div><div class="progresswrap"><div class="progress" style="width:${((state.index+1)/questions.length*100)}%"></div></div><section class="question-card"><div class="question-banner"><div class="question-topic">${esc(q.topic)}</div><h2>${esc(q.q)}</h2>${q.context?`<p class="qcontext">${esc(q.context)}</p>`:''}</div><div class="question-art">${topicArt(state.index)}</div><div class="options">${q.a.map((a,i)=>`<button type="button" class="option" aria-pressed="${sel===i}" onclick="choose(${i})"><span class="letter">${'ABC'[i]}</span><span class="optext">${esc(a)}</span><span class="radio-dot" aria-hidden="true"></span></button>`).join('')}</div></section><div class="footer-controls"><button class="action secondary footer-back" onclick="prev()">${iconBack} Atrás</button><button class="action continue-action" ${sel===null?'disabled':''} onclick="next()">${state.index===questions.length-1?'Ver resultado':'Continuar'} ${iconArrow}</button></div>`)}function choose(i){state.answers[state.index]=i;save();quiz()}function prev(){if(state.index===0){state.screen='home'}else{state.index--}render()}function next(){if(state.answers[state.index]===null)return;if(state.index===questions.length-1){state.screen='results'}else state.index++;render()}function pct(n){return Math.round(n/questions.length*100)}function results(){const complete=state.answers.filter(x=>x!==null).length;if(complete<questions.length){state.screen='quiz';state.index=state.answers.findIndex(x=>x===null);return quiz()}const counts=[0,0,0];state.answers.forEach(a=>counts[a]++);let sections=[{label:'Respuestas A',v:counts[0]},{label:'Respuestas B',v:counts[1]},{label:'Respuestas C',v:counts[2]}];shell(`<section class="party-reveal"><div class="eyebrow">Tu resultado · 15 preguntas</div><h2>Aunque de todos los partidos, solo <em>XX han tenido la decencia de publicar su programa electoral</em>, creemos que el partido que más se acerca a tus prioridades es...</h2><div class="party-id"><div style="position:relative"><div class="party-art" aria-label="Silueta de marcador de posición"></div><span class="party-flag" aria-hidden="true">⚑</span></div><div><div class="party-name">Por determinar</div><div class="party-caption">Aquí aparecerán el líder y el símbolo del partido cuando verifiquemos las propuestas y calculemos las coincidencias.</div></div></div><div class="party-note">Vista previa de diseño · XX es un marcador de posición, no un dato verificado.</div></section><div class="results-head"><div class="eyebrow">Cuestionario completado</div><h2>15 decisiones.<br>Un montón de matices.</h2><p>Estas son las respuestas que has elegido. No interpretamos A, B y C como ideologías: su significado cambia en cada pregunta.</p></div><div class="stats"><div class="stat"><strong>15/15</strong><span>Preguntas respondidas</span></div><div class="stat"><strong>100%</strong><span>Tu recorrido completado</span></div></div><div class="section">Distribución de tus respuestas</div><div style="background:#f7f8fc;padding:17px;border-radius:20px">${sections.map(s=>`<div class="barlabel"><span>${s.label}</span><span>${pct(s.v)}%</span></div><div class="bar"><i style="width:${pct(s.v)}%"></i></div>`).join('')}<p class="smallnote">Estos porcentajes son únicamente un recuento de letras. No indican coincidencia con partidos ni rigor científico.</p></div><div class="section">Audita tus 15 respuestas</div><div class="review">${questions.map((q,i)=>`<button class="review-item" onclick="jump(${i})"><strong>${String(i+1).padStart(2,'0')}. ${esc(q.q)}</strong><span>Tu respuesta: ${'ABC'[state.answers[i]]} · ${esc(q.a[state.answers[i]])}</span></button>`).join('')}</div><div style="margin-top:20px;display:grid;gap:10px"><button class="action full" onclick="copyReview()">Copiar mis respuestas para la auditoría ${iconDiagonal}</button><button class="action secondary full" onclick="restart()">Volver a empezar ${iconReload}</button></div><p class="smallnote" style="padding:12px 2px">Versión piloto. Las comparaciones porcentuales con partidos se añadirán únicamente cuando haya correspondencias documentadas entre propuestas y respuestas. Esta versión no recomienda un voto.</p>`)}function jump(i){state.index=i;state.screen='quiz';render()}function copyReview(){let str='AUDITORÍA — EN QUÉ CREES\n\n'+questions.map((q,i)=>`${i+1}. ${q.q}\n${'ABC'[state.answers[i]]}. ${q.a[state.answers[i]]}`).join('\n\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(str).then(()=>alert('Respuestas copiadas. Pégalas en el chat para revisarlas.')).catch(()=>fallback(str))}else fallback(str)}function fallback(str){let t=document.createElement('textarea');t.value=str;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Respuestas copiadas.')}function restart(){if(!confirm('¿Quieres borrar las respuestas y empezar de nuevo?'))return;state.answers=Array(questions.length).fill(null);state.screen='home';save();render()}function render(){window.scrollTo(0,0);if(state.screen==='home')home();else if(state.screen==='quiz')quiz();else results()}window.start=start;window.choose=choose;window.prev=prev;window.next=next;window.jump=jump;window.restart=restart;window.copyReview=copyReview;render();
</script></body></html>
